[project]
name = "mes-bridge"
version = "0.1.0"
description = "Runs the simulation scheduler against the Fidentis MES API (not part of the thesis)."
requires-python = ">=3.14"
dependencies = [
    "simulation",
]

[tool.uv.sources]
# Editable path dependency, not a uv workspace: the thesis lock (../uv.lock) stays untouched.
simulation = { path = "..", editable = true }

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120
