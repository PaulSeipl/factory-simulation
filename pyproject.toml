[project]
name = "simulation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paul Seipl", email = "paulseipl@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.1",
    "simpy>=4.1.2",
]

[project.scripts]
simulation = "simulation:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
