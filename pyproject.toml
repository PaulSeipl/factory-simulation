[project]
name = "simulation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paul Seipl", email = "paulseipl@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.1",
]

[project.scripts]
simulation = "simulation:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
exclude = [
  "__init__.py",
  "venv",
  ".env",
  ".venv",
  "alembic",
  "tests",
  "scripts/create_user.py",
  "openapi.json"
]
line-length = 120

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG001",  # unused arguments in functions
  "T201",  # print statements are not allowed
  "SIM",
  "PLC0415"
]
ignore = [
  "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.per-file-ignores]
"./app/models/**" = [
  "UP045",
  "UP037",
  "F821",
  "E501"
]  # Allow using SQLAlchemy ORM attributes without type annotations, and referencing names that are only defined at runtime by SQLAlchemy.
"./tests/**" = [
  "S101",
  "T201",
  "ARG001",
  "F841"
]  # Allow using assert statements in tests.
